services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./flamegraphs:/app/../flamegraphs
      - ./backend/metrics.db:/app/metrics.db
    privileged: true          # needed for perf inside container
    pid: host                 # share host PID namespace for perf
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    restart: unless-stopped
